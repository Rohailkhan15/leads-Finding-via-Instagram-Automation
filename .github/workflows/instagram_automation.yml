name: Instagram Lead Generation

# Manual runs only -- trigger from the Actions tab (Run workflow) or locally.
# No schedule: outreach capacity is the bottleneck, not lead supply.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Avoid overlapping runs if a previous manual run is still in progress.
concurrency:
  group: instagram-automation
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Instagram automation script
        env:
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: python instagram_automation.py
